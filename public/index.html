function abbr(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function imgTag(fig){return '<img src="'+fig.img+'" data-abbr="'+abbr(fig.e)+'" alt="" loading="lazy">';}
document.addEventListener('error',e=>{const el=e.target;if(!el||el.tagName!=='IMG'||!el.dataset.abbr)return;const d=document.createElement('div');d.className='avatar';d.textContent=el.dataset.abbr;el.replaceWith(d);},true);

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}
function flash(c){const f=$('flash');f.style.background=c||'#fff';f.style.transition='none';f.style.opacity=.8;requestAnimationFrame(()=>{f.style.transition='opacity .55s';f.style.opacity=0;});}

function weighted(arr){const tot=arr.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;for(const x of arr){if(r<x.w)return x.t;r-=x.w;}return arr[0].t;}
function randomFigFromTier(t){const a=PACK[t];return a[Math.floor(Math.random()*a.length)];}
function randomFig(){const r=Math.random();if(r<0.06)return SC;if(r<0.11)return BN;return randomFigFromTier(weighted(VISUAL_TIERS));}
function randomFigNot(ex){for(let i=0;i<25;i++){const f=randomFig();if(!ex||f.e!==ex.e)return f;}return PACK[1][0];}

function currentRTP(){if(S.stats.spent<20)return TARGET_RTP-0.03;return S.stats.won/S.stats.spent;}
function makeGrid(center){return [0,1,2].map(i=>{const top=randomFigNot(center[i]);let bot=randomFigNot(center[i]);if(top.e===bot.e)bot=randomFigNot(center[i]);return [top,center[i],bot];});}

function createJackpot(){const f=PACK[10][0];return{type:'JACKPOT',prize:Math.max(100,+S.pool.toFixed(2)),center:[f,f,f],mult:1,label:'JACKPOT'};}
function createWin(tier,label){let t=tier,prize=WIN_PRIZE[t];const maxPay=Math.max(1,S.bank*0.65);
 while(t>1&&WIN_PRIZE[t]>maxPay)t--;
 const mr=Math.random();let mult=1;
 if(mr<0.004)mult=10;else if(mr<0.019)mult=5;else if(mr<0.059)mult=3;else if(mr<0.139)mult=2;
 prize=Math.min(WIN_PRIZE[t]*mult,maxPay*mult);prize=+prize.toFixed(2);
 const f=randomFigFromTier(t);return{type:'WIN',tier:t,prize,mult,center:[f,f,f],label:label||'WIN'};}
function createNear(tier){let t=tier===10?9:tier;let prize=+Math.min(NEAR_PRIZE[t],Math.max(.2,S.bank*.25)).toFixed(2);
 const f=randomFigFromTier(t),th=randomFigNot(f);return{type:'NEAR',tier:t,prize,mult:1,center:[f,f,th],label:T('near')};}
function createMini(){const t=[1,1,1,2,2,3][Math.floor(Math.random()*6)];let prize=+Math.min(rnd(.25,.8),Math.max(.2,S.bank*.2)).toFixed(2);
 const f=randomFigFromTier(t),th=randomFigNot(f);return{type:'MINI',tier:t,prize,mult:1,center:[f,f,th],label:'MINI'};}
function createLose(){const a=randomFig(),b=randomFigNot(a);let c=randomFigNot(b);if(c.e===a.e)c=randomFigNot(a);return{type:'LOSE',prize:0,mult:1,center:[a,b,c],label:''};}
function createScatter(){return{type:'SCATTER',prize:0,mult:1,center:[SC,SC,SC],label:'SCATTER'};}
function createBonus(){return{type:'BONUSGAME',prize:0,mult:1,center:[BN,BN,BN],label:'BONUS'};}

function pickOutcome(){
 if(S.fever>=100)return createWin(weighted(FEVER_TIERS),'FEVER');
 const rtp=currentRTP();
 let ctrl=clamp(1+(TARGET_RTP-rtp)*2.2,0.25,1.8);
 if(S.bank<30)ctrl*=0.25;
 const r=Math.random();
 if(r<0.0017)return createScatter();
 if(r<0.0027)return createBonus();
 const jackpotP=S.pool>=100?0.0012*Math.min(ctrl,1.5):0;
 const winP=0.05*ctrl,nearP=0.30*clamp(ctrl,0.7,1.25),miniP=0.25;
 if(r<jackpotP)return createJackpot();
 if(r<winP)return createWin(weighted(WIN_TIERS));
 if(r<winP+nearP)return createNear(weighted(NEAR_TIERS));
 if(r<winP+nearP+miniP)return createMini();
 return createLose();
}

const reels=[...document.querySelectorAll('.strip')];
function symHTML(fig){
 if(fig.sp==='scatter')return '<div class="sym"><div class="sp scatter">★</div></div>';
 if(fig.sp==='bonus')return '<div class="sym"><div class="sp bonus">🎁</div></div>';
 return '<div class="sym">'+imgTag(fig)+'</div>';
}
function renderIdle(){reels.forEach(st=>{st.style.transition='none';st.style.transform='translateY(0)';st.innerHTML=[randomFig(),randomFig(),randomFig()].map(symHTML).join('');});}
function cellH(){return document.querySelector('.reel').clientHeight/3;}
async function animateSpin(out){
 const h=cellH(),dur=S.turbo?200:600,del=S.turbo?[0,35,70]:[0,110,220],cnt=S.turbo?6:15;
 const ps=reels.map((st,i)=>{
  const syms=[];for(let k=0;k<cnt;k++)syms.push(randomFig());
  syms.push(out.grid[i][0],out.grid[i][1],out.grid[i][2]);
  st.style.transition='none';st.style.transform='translateY(0)';st.innerHTML=syms.map(symHTML).join('');
  void st.offsetHeight;
  st.style.transition='transform '+dur+'ms cubic-bezier(.2,.8,.2,1) '+del[i]+'ms';
  st.style.transform='translateY('+(-(syms.length-3)*h)+'px)';
  return new Promise(res=>setTimeout(res,dur+del[i]+35));
 });
 await Promise.all(ps);
}

function addWinFeed(fig,prize){const w=$('wins');const el=document.createElement('div');el.className='wc';
 el.innerHTML=(fig.sp?'<span style="font-size:14px">'+(fig.sp==='scatter'?'★':'🎁')+'</span>':imgTag(fig))+'<span>+'+fmt(prize)+'$</span>';
 w.insertBefore(el,w.firstChild);while(w.children.length>8)w.removeChild(w.lastChild);}

function burst(color,n){const cv=$('fx'),ctx=cv.getContext('2d'),d=Math.min(2,devicePixelRatio||1);
 cv.width=innerWidth*d;cv.height=innerHeight*d;
 const parts=[],cx=innerWidth/2*d,cy=innerHeight/2*d;
 for(let i=0;i<(n||30);i++){const a=Math.random()*Math.PI*2,v=rnd(3,11)*d;
  parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3*d,life:1,c:color,s:rnd(2,5)*d});}
 let raf;function step(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;
  for(const p of parts){if(p.life<=0)continue;alive=true;p.vy+=.3*d;p.x+=p.vx;p.y+=p.vy;p.life-=.028;
   ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*1.6);}
  ctx.globalAlpha=1;if(alive)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);}
 cancelAnimationFrame(raf);step();}
function goldRain(){const cv=$('fx'),ctx=cv.getContext('2d'),d=Math.min(2,devicePixelRatio||1);
 cv.width=innerWidth*d;cv.height=innerHeight*d;
 const cols=['#ffd75e','#fff3c4','#ff5c5c','#f4f7fc'],parts=[];
 for(let i=0;i<60;i++)parts.push({x:Math.random()*cv.width,y:-rnd(0,200)*d,vy:rnd(2,5)*d,vx:rnd(-1,1)*d,life:1,c:cols[i%4],s:rnd(2,5)*d});
 let raf;function step(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;
  for(const p of parts){p.y+=p.vy;p.x+=p.vx;if(p.y<cv.height)alive=true;
   ctx.globalAlpha=.9;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*1.6);}
  ctx.globalAlpha=1;if(alive)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);}
 cancelAnimationFrame(raf);step();}

function reelGlow(){document.querySelectorAll('.reel').forEach(r=>{r.classList.add('glow');setTimeout(()=>r.classList.remove('glow'),1400);});}
let bigTimer;
function showBig(out){
 const el=$('bigWin'),fig=out.center[0],ratio=out.prize/SPIN_COST;
 el.className='bigfig'+(ratio>=50||out.type==='JACKPOT'?' epic':ratio>=20?' mega':'');
 $('bigFace').innerHTML=fig.sp?'<div class="sp scatter" style="width:140px;height:140px;font-size:70px;border-radius:50%">★</div>':imgTag(fig);
 $('bigName').textContent=fig.sp?(fig.sp==='scatter'?'10 '+T('freespins'):T('pick')):fig.n;
 $('bigPrize').textContent=out.prize>0?'+'+fmt(out.prize)+'$':(out.mult>1?'x'+out.mult:'★');
 $('bigSub').textContent=(out.mult>=10?'ULTRA · ':'')+(ratio>=50||out.type==='JACKPOT'?T('epic'):ratio>=20?T('mega'):ratio>=8?T('big'):(out.label||''));
 el.classList.remove('hidden');
 if(ratio>=20||out.type==='JACKPOT'){flash(ratio>=50?'#ffd75e':'#fff');goldRain();}
 burst(ratio>=20?'#ffd75e':'#ff6a00',ratio>=20?60:30);
 reelGlow();hapOk();
 clearTimeout(bigTimer);
 bigTimer=setTimeout(()=>el.classList.add('hidden'),ratio>=50?1800:ratio>=20?1400:1000);
}

function applyOutcome(out){
 S.qprog.q1++;
 if(out.type==='SCATTER'){S.free+=10;showBig(out);toast('★ +10 '+T('freespins'));}
 else if(out.type==='BONUSGAME'){S.qprog.q3++;openBonusGame();}
 else if(out.prize>0){
  S.balance+=out.prize;S.stats.won+=out.prize;
  if(out.type==='JACKPOT')S.pool=100;else S.bank=Math.max(0,S.bank-out.prize);
  if(out.tier>=5)S.qprog.q2++;
  S.fever=0;addWinFeed(out.center[0],out.prize);
  if(out.prize>=8||out.type==='JACKPOT')showBig(out);
  else{toast('+'+fmt(out.prize)+'$'+(out.mult>1?' · x'+out.mult:''));reelGlow();hap('medium');}
 }else{
  if(out.type==='LOSE')S.fever=Math.min(100,S.fever+10);
  if(out.type==='NEAR')S.fever=Math.min(100,S.fever+5);
  if(out.type==='MINI')S.fever=Math.min(100,S.fever+3);
 }
 updateHUD();save();
}

function updateHUD(){
 $('balVal').textContent=fmt(S.balance);
 $('poolVal').textContent=fmt(S.pool);
 $('feverBar').style.width=S.fever+'%';
 $('feverWrap').classList.toggle('full',S.fever>=100);
 const sb=$('spinBtn');
 sb.disabled=S.spinning||(S.free===0&&S.balance<SPIN_COST);
 sb.textContent=(S.free>0?'★ ':'')+T('spin')+' '+fmt(SPIN_COST)+'$';
 sb.classList.toggle('ready',!S.spinning);
 $('turboBtn').classList.toggle('on',S.turbo);
 const fc=$('freeChip');fc.classList.toggle('hidden',S.free===0);$('freeVal').textContent=S.free;
 document.querySelectorAll('.autoBtn').forEach(b=>b.classList.toggle('on',S.auto>0&&+b.dataset.auto!==0));
}

async function spin(){
 if(S.spinning)return;
 const isFree=S.free>0;
 if(!isFree&&S.balance<SPIN_COST){if(S.auto>0)S.auto=0;toast(T('noFunds'));updateHUD();return;}
 S.spinning=true;
 if(isFree)S.free--;else{S.balance-=SPIN_COST;S.stats.spent+=SPIN_COST;}
 S.stats.spins++;S.bank+=BANK_CUT;S.pool+=POOL_CUT;
 updateHUD();
 const out=pickOutcome();out.grid=makeGrid(out.center);
 hap('light');
 await animateSpin(out);
 applyOutcome(out);
 S.spinning=false;updateHUD();
 if(S.auto>0){S.auto--;updateHUD();setTimeout(spin,S.turbo?70:230);}
}

function openBonusGame(){
 const pool=[2,3,5,8,15,25].sort(()=>Math.random()-.5).slice(0,3);
 const bx=$('bonusBoxes');bx.innerHTML='';
 pool.forEach(m=>{const b=document.createElement('button');b.className='bbox';b.textContent='🎁';
  b.onclick=()=>{if(b.classList.contains('open'))return;
   bx.querySelectorAll('.bbox').forEach(x=>x.style.pointerEvents='none');
   b.classList.add('open');b.textContent='x'+m;
   const prize=+(SPIN_COST*m).toFixed(2);
   S.balance+=prize;S.stats.won+=prize;S.bank=Math.max(0,S.bank-prize);
   flash('#ffd75e');burst('#ffd75e',50);goldRain();hapOk();
   addWinFeed(BN,prize);updateHUD();save();
   setTimeout(()=>{$('bonusModal').classList.remove('open');toast('+'+fmt(prize)+'$');},1100);
  };bx.appendChild(b);});
 $('bonusModal').classList.add('open');
}

function buildPaytable(){const c=$('paytable');c.innerHTML='';
 for(let t=10;t>=1;t--){const f=PACK[t][0];const el=document.createElement('div');el.className='pt-row';
  el.innerHTML='<div class="pt-face">'+imgTag(f)+'</div><div class="pt-val">'+(t===10?'JACKPOT':WIN_PRIZE[t]+'$')+'</div>';
  el.onclick=()=>showTierModal(t);c.appendChild(el);}}
function showTierModal(t){
 $('tmTitle').textContent=T('level')+' '+t;
 $('tmRows').innerHTML=PACK[t].map(f=>'<div class="pool-row">'+imgTag(f)+'<div><div class="pr-name">'+(S.lang==='ru'?f.n:f.e)+'</div><div class="pr-alias">'+T('chance')+' 1/'+PACK[t].length+'</div></div><div style="margin-left:auto;font-family:\'Russo One\';color:var(--gold)">'+(t===10?'POOL':WIN_PRIZE[t]+'$')+'</div></div>').join('');
 $('tmClose').textContent=T('close');
 $('tierModal').classList.add('open');
}

function openQuests(){
 $('questRows').innerHTML=QUESTS.map(q=>{
  const prog=Math.min(S.qprog[q.id],q.need),done=prog>=q.need,claimed=!!S.qclaim[q.id];
  return '<div class="q-row"><div class="q-txt">'+T(q.id)+'<br><span style="color:var(--gold);font-family:\'Russo One\';font-size:9px">+'+q.reward+'$</span></div><div class="q-prog">'+prog+'/'+q.need+'</div><button class="q-claim" data-q="'+q.id+'" '+(done&&!claimed?'':'disabled')+'>'+ (claimed?'✓':T('claim'))+'</button></div>';
 }).join('');
 $('qmClose').textContent=T('close');
 $('questModal').classList.add('open');
}
$('questRows').addEventListener('click',e=>{
 const b=e.target.closest('.q-claim');if(!b||b.disabled)return;
 const q=QUESTS.find(x=>x.id===b.dataset.q);
 S.qclaim[q.id]=1;S.balance+=q.reward;toast('+'+q.reward+'$');flash('#3ecf8e');
 updateHUD();save();openQuests();
});

$('promoGo').onclick=()=>{
 const code=($('promoInput').value||'').trim().toUpperCase();
 if(!PROMOS[code]){toast(T('promoBad'));return;}
 if(S.usedPromos.includes(code)){toast(T('promoBad'));return;}
 S.usedPromos.push(code);S.balance+=PROMOS[code];
 toast(T('promoOk')+' +'+PROMOS[code]+'$');flash('#3ecf8e');
 $('promoModal').classList.remove('open');updateHUD();save();
};

$('shareBtn').onclick=async()=>{
 const txt='🔥 GOLDEN POLIT SLOTS: ТРАМП, ПУТИН, КАМАЛА — кто выпадет тебе? Я занёс '+fmt(S.stats.won)+'$! Залетай 👉 '+location.href;
 try{
  if(navigator.share)await navigator.share({text:txt});
  else await navigator.clipboard.writeText(txt);
  if(S.sharedDate!==today()){S.sharedDate=today();S.free+=5;toast(T('shared'));}
  else toast('OK');
  updateHUD();save();
 }catch(e){}
};

function checkDaily(){
 const t=today();if(S.dailyLast===t)return;
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 const streak=(S.dailyLast===y)?S.dailyStreak+1:1;
 const reward=20+Math.min(streak,7)*10;
 S._pendingDaily={streak,reward};
 $('dailyStreak').textContent=streak;
 $('dailyReward').textContent='+'+reward+'$';
 setTimeout(()=>$('dailyModal').classList.add('open'),600);
}
$('dailyClaim').onclick=()=>{
 const p=S._pendingDaily;if(!p)return;
 S.balance+=p.reward;S.dailyLast=today();S.dailyStreak=p.streak;S._pendingDaily=null;
 $('dailyModal').classList.remove('open');
 toast('+'+p.reward+'$');flash('#ffd75e');burst('#ffd75e',40);
 updateHUD();save();
};

function applyLang(){
 document.querySelectorAll('[data-k]').forEach(el=>el.textContent=T(el.dataset.k));
 $('langBtn').textContent=S.lang==='ru'?'EN':'RU';
 updateHUD();
}
$('langBtn').onclick=()=>{S.lang=S.lang==='ru'?'en':'ru';save();applyLang();};

document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m&&!m.id==='bonusModal')m.classList.remove('open');}));
$('spinBtn').onclick=spin;
$('turboBtn').onclick=()=>{S.turbo=!S.turbo;updateHUD();save();};
document.querySelectorAll('.autoBtn').forEach(b=>b.onclick=()=>{
 const n=+b.dataset.auto;
 if(n===0||S.auto>0){S.auto=0;updateHUD();return;}
 S.auto=n;updateHUD();spin();
});
$('topUpBtn').onclick=()=>{S.balance+=100;toast('+100 USDT (demo)');updateHUD();save();};
$('walletBtn').onclick=()=>toast(T('demo'));
$('questBtn').onclick=openQuests;
$('promoBtn').onclick=()=>{$('pmClose2').textContent=T('close');$('promoModal').classList.add('open');};

buildPaytable();renderIdle();applyLang();updateHUD();checkDaily();
</script>
</body>
</html>
