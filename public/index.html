/* ЭКОНОМИКА: кластер = тир × размер. Множители от ставки. RTP-контроллер держит ~85% */
const BASE_BET=4.00;
const BET_LEVELS=[1,2,4,10,25,50,100];
const BANK_CUT_RATIO=0.1375,POOL_CUT_RATIO=0.0875,TARGET_RTP=0.85;
const TIER_BASE={1:.2,2:.4,3:.7,4:1.2,5:2,6:4,7:9,8:15,9:50,10:0};
const SIZE_MULT={5:1,6:1.2,7:1.6,8:2,9:2.6,10:3.2,11:4,12:5,13:6.5,14:8,15:10};
let ACTIVE_BET=BASE_BET;

try{const raw=localStorage.getItem(KEY);
 if(raw){const sv=JSON.parse(raw);Object.assign(S,sv);S.spinning=false;S.auto=0;}
 else{const old=localStorage.getItem('gp_slots_v2')||localStorage.getItem('gp_slots_v1');if(old){const o=JSON.parse(old);S.balance=o.balance??S.balance;S.pool=o.pool??S.pool;}}
}catch(e){}
if(S.qdate!==today()){S.qdate=today();S.qprog={q1:0,q2:0,q3:0};S.qclaim={};}

function imgTag(fig){return '<img src="'+fig.img+'" data-abbr="'+abbr(fig.e)+'" alt="" loading="lazy">';}
document.addEventListener('error',e=>{const el=e.target;if(!el||el.tagName!=='IMG'||!el.dataset.abbr)return;const d=document.createElement('div');d.className='avatar';d.textContent=el.dataset.abbr;el.replaceWith(d);},true);

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}
function flash(c){const f=$('flash');f.style.background=c||'#fff';f.style.transition='none';f.style.opacity=.8;requestAnimationFrame(()=>{f.style.transition='opacity .55s';f.style.opacity=0;});}

function weighted(arr){const tot=arr.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;for(const x of arr){if(r<x.w)return x.t;r-=x.w;}return arr[0].t;}
function randomFigFromTier(t){const a=PACK[t];return a[Math.floor(Math.random()*a.length)];}
const VISUAL_TIERS=[{t:1,w:26},{t:2,w:19},{t:3,w:14},{t:4,w:11},{t:5,w:9},{t:6,w:7},{t:7,w:4},{t:8,w:3},{t:9,w:2}];
function randomFig(){const r=Math.random();if(r<0.02)return SC;if(r<0.04)return BN;return randomFigFromTier(weighted(VISUAL_TIERS));}

function currentRTP(){if(S.stats.spent<20)return TARGET_RTP-0.03;return S.stats.won/S.stats.spent;}

/* кластер-конфиги: cls 0=луз, далее тиры/размеры */
function rollConfig(ctrl){
 const table=[
  {cls:0,w:52},
  {cls:1,w:22,t:[1,2],s:[5,7]},
  {cls:2,w:14,t:[3,4],s:[5,8]},
  {cls:3,w:5*ctrl,t:[5,6],s:[5,9]},
  {cls:4,w:0.8*ctrl,t:[7,8],s:[5,8]},
  {cls:5,w:0.15*ctrl,t:[9,9],s:[5,7]},
  {cls:6,w:(S.pool>=100?0.02*ctrl:0),t:[10,10],s:[5,6]}];
 const tot=table.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;
 for(const x of table){if(r<x.w)return x;r-=x.w;}
 return table[0];
}
function partPay(t,size){
 if(t===10)return Math.max(100,+S.pool.toFixed(2));
 return +(TIER_BASE[t]*SIZE_MULT[size]*ACTIVE_BET).toFixed(2);
}
function pickOutcome(){
 const out={parts:[],scatter:0,bonus:0,near:null,total:0};
 if(S.fever>=100){
  const t=weighted([{t:5,w:35},{t:6,w:25},{t:7,w:18},{t:8,w:14},{t:9,w:8}]);
  out.parts.push({t,size:weighted([{t:6,w:30},{t:7,w:30},{t:8,w:25},{t:9,w:15}])});
 } else {
  const r0=Math.random();
  if(r0<0.0017){out.scatter=6+Math.floor(Math.random()*3);}
  else if(r0<0.0027){out.bonus=4;}
  else{
   const rtp=currentRTP();
   let ctrl=clamp(1+(TARGET_RTP-rtp)*2.2,0.25,1.8);
   if(S.bank<30)ctrl*=0.25;
   const cfg=rollConfig(ctrl);
   if(cfg.cls>0){
    const t=cfg.t[Math.floor(Math.random()*cfg.t.length)];
    const size=cfg.s[Math.floor(Math.random()*(cfg.s[1]-cfg.s[0]+1))+ (0)]||cfg.s[0];
    const sz=clamp(cfg.s[0]+Math.floor(Math.random()*(cfg.s[1]-cfg.s[0]+1)),5,15);
    out.parts.push({t,size:sz});
    if(cfg.cls>=3)out.parts.push({t:weighted([{t:1,w:40},{t:2,w:35},{t:3,w:25}]),size:5+Math.floor(Math.random()*3)});
    if(cfg.cls>=5)out.parts.push({t:weighted([{t:2,w:50},{t:3,w:50}]),size:5+Math.floor(Math.random()*2)});
   } else if(Math.random()<0.35){
    out.near={t:weighted([{t:7,w:40},{t:8,w:35},{t:9,w:25}]),size:4};
   }
  }
 }
 /* цены + даунгрейд по банку */
 const maxPay=Math.max(ACTIVE_BET*2,S.bank*0.7);
 out.parts.forEach(p=>{
  let t=p.t,size=p.size;
  if(t!==10){while(t>1&&partPay(t,size)>maxPay)t--;
   let pay=partPay(t,size);if(pay>maxPay)pay=maxPay;
   p.amount=pay;p.t=t;
  } else {p.amount=partPay(10,size);}
 });
 out.total=+out.parts.reduce((s,p)=>s+p.amount,0).toFixed(2);
 return out;
}

/* сетка */
let G=[],CELLS=[];
function placeCluster(g,occ,fig,size,cells){
 for(let tr=0;tr<80;tr++){
  const c0=Math.floor(Math.random()*COLS),r0=Math.floor(Math.random()*ROWS);
  const k0=c0+','+r0;if(occ.has(k0))continue;
  const shape=[[c0,r0]],used=new Set([k0]);
  while(shape.length<size){
   const b=shape[Math.floor(Math.random()*shape.length)];
   const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);
   let ok=false;
   for(const d of dirs){const nc=b[0]+d[0],nr=b[1]+d[1];
    if(nc<0||nc>=COLS||nr<0||nr>=ROWS)continue;
    const k=nc+','+nr;if(used.has(k)||occ.has(k))continue;
    used.add(k);shape.push([nc,nr]);ok=true;break;}
   if(!ok)break;
  }
  if(shape.length===size){shape.forEach(([c,r])=>{g[c][r]=fig;occ.add(c+','+r);cells.push([c,r]);});return true;}
 }
 return false;
}
function buildGrid(out){
 const g=[];for(let c=0;c<COLS;c++){g[c]=[];for(let r=0;r<ROWS;r++)g[c][r]=randomFig();}
 const occ=new Set();
 out.parts.slice().sort((a,b)=>b.size-a.size).forEach(p=>{
  p.cells=[];p.fig=p.t===10?PACK[10][0]:randomFigFromTier(p.t);
  placeCluster(g,occ,p.fig,p.size,p.cells);
 });
 if(out.near){out.near.cells=[];out.near.fig=randomFigFromTier(out.near.t);placeCluster(g,occ,out.near.fig,out.near.size,out.near.cells);}
 if(out.scatter){out.scatterCells=[];let n=0,tr=0;while(n<out.scatter&&tr++<200){const c=Math.floor(Math.random()*COLS),r=Math.floor(Math.random()*ROWS);const k=c+','+r;if(occ.has(k))continue;occ.add(k);g[c][r]=SC;out.scatterCells.push([c,r]);n++;}}
 if(out.bonus){out.bonusCells=[];let n=0,tr=0;while(n<out.bonus&&tr++<200){const c=Math.floor(Math.random()*COLS),r=Math.floor(Math.random()*ROWS);const k=c+','+r;if(occ.has(k))continue;occ.add(k);g[c][r]=BN;out.bonusCells.push([c,r]);n++;}}
 return g;
}
function cellHTML(fig){
 if(fig.sp==='scatter')return '<div class="sp scatter">★</div>';
 if(fig.sp==='bonus')return '<div class="sp bonus">🎁</div>';
 return imgTag(fig);
}
function renderGrid(anim){
 const gridEl=$('grid');gridEl.innerHTML='';CELLS=[];
 for(let c=0;c<COLS;c++)CELLS[c]=[];
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const d=document.createElement('div');d.className='cell'+(anim?' '+anim:'');
  if(anim)d.style.animationDelay=(c*40+r*20)+'ms';
  d.innerHTML=cellHTML(G[c][r]);
  gridEl.appendChild(d);CELLS[c][r]=d;
 }
}
function floatAmt(cells,txt){
 if(!cells.length)return;
 const reelR=$('reels').getBoundingClientRect();
 let x=0,y=0;cells.forEach(([c,r])=>{const cr=CELLS[c][r].getBoundingClientRect();x+=cr.left+cr.width/2;y+=cr.top+cr.height/2;});
 x=x/cells.length-reelR.left;y=y/cells.length-reelR.top;
 const f=document.createElement('div');f.className='float-amt';f.textContent=txt;
 f.style.left=x+'px';f.style.top=y+'px';
 $('reels').appendChild(f);setTimeout(()=>f.remove(),900);
}

function burst(color,n){const cv=$('fx'),ctx=cv.getContext('2d'),d=Math.min(2,devicePixelRatio||1);
 cv.width=innerWidth*d;cv.height=innerHeight*d;
 const parts=[],cx=innerWidth/2*d,cy=innerHeight/2*d;
 for(let i=0;i<(n||30);i++){const a=Math.random()*Math.PI*2,v=rnd(3,11)*d;
  parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3*d,life:1,c:color,s:rnd(2,5)*d});}
 let raf;function step(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;
  for(const p of parts){if(p.life<=0)continue;alive=true;p.vy+=.3*d;p.x+=p.vx;p.y+=p.vy;p.life-=.028;
   ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*1.6);}
  ctx.globalAlpha=1;if(alive)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);}
 cancelAnimationFrame(raf);step();}
function goldRain(){const cv=$('fx'),ctx=cv.getContext('2d'),d=Math.min(2,devicePixelRatio||1);
 cv.width=innerWidth*d;cv.height=innerHeight*d;
 const cols=['#ffd75e','#fff3c4','#ff5c5c','#f4f7fc'],parts=[];
 for(let i=0;i<60;i++)parts.push({x:Math.random()*cv.width,y:-rnd(0,200)*d,vy:rnd(2,5)*d,vx:rnd(-1,1)*d,c:cols[i%4],s:rnd(2,5)*d});
 let raf;function step(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;
  for(const p of parts){p.y+=p.vy;p.x+=p.vx;if(p.y<cv.height)alive=true;
   ctx.globalAlpha=.9;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*1.6);}
  ctx.globalAlpha=1;if(alive)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);}
 cancelAnimationFrame(raf);step();}

let bigTimer;
function showBig(fig,prize,label,cls){
 const el=$('bigWin');
 el.className='bigfig'+(cls||'');
 $('bigFace').innerHTML=fig.sp?'<div class="sp scatter" style="width:140px;height:140px;font-size:70px;border-radius:50%">★</div>':imgTag(fig);
 $('bigName').textContent=fig.sp?(fig.sp==='scatter'?'10 '+T('freespins'):T('pick')):fig.n;

 $('bigSub').textContent=label||'';
 el.classList.remove('hidden');
 clearTimeout(bigTimer);
 bigTimer=setTimeout(()=>el.classList.add('hidden'),cls==='epic'?1800:cls==='mega'?1400:1000);
}

function addWinFeed(fig,prize){const w=$('wins');const el=document.createElement('div');el.className='wc';
 el.innerHTML=(fig.sp?'<span style="font-size:14px">'+(fig.sp==='scatter'?'★':'🎁')+'</span>':imgTag(fig))+'<span>+'+fmt(prize)+'$</span>';
 w.insertBefore(el,w.firstChild);while(w.children.length>8)w.removeChild(w.lastChild);}

async function playSpin(out){
 const K=S.turbo?0.45:1;
 renderGrid('drop');
 await wait(420*K+200);
 for(let i=0;i<out.parts.length;i++){
  const p=out.parts[i];
  if(!p.cells||!p.cells.length)continue;
  p.cells.forEach(([c,r])=>CELLS[c][r].classList.add('hit'));
  hap('medium');
  await wait(430*K);
  p.cells.forEach(([c,r])=>CELLS[c][r].classList.add('boom'));
  floatAmt(p.cells,'+'+fmt(p.amount)+(i>0?' · CASCADE x'+(i+1):''));
  await wait(260*K);
  p.cells.forEach(([c,r])=>{G[c][r]=randomFig();CELLS[c][r].className='cell fall';CELLS[c][r].innerHTML=cellHTML(G[c][r]);});
  await wait(200*K);
 }
 if(out.near&&out.near.cells&&out.near.cells.length){
  out.near.cells.forEach(([c,r])=>CELLS[c][r].classList.add('nearMiss'));
  toast('😱 '+T('near'));
  await wait(600*K);
  out.near.cells.forEach(([c,r])=>CELLS[c][r].classList.remove('nearMiss'));
 }
 if(out.scatterCells&&out.scatterCells.length){
  out.scatterCells.forEach(([c,r])=>CELLS[c][r].classList.add('hit'));
  await wait(500*K);
 }
}

function applyOutcome(out){
 S.qprog.q1++;
 if(out.scatter){S.free+=10;S.freeBet=ACTIVE_BET;showBig(SC,0,'★ '+T('freespins'),'');flash('#ffd75e');burst('#ffd75e',40);hapOk();}
 if(out.bonus){S.qprog.q3++;openBonusGame();}
 if(out.total>0){
  S.balance+=out.total;S.stats.won+=out.total;
  const jack=out.parts.some(p=>p.t===10);
  if(jack)S.pool=100;else S.bank=Math.max(0,S.bank-out.total);
  if(out.parts.some(p=>p.t>=5))S.qprog.q2++;
  S.fever=0;
  addWinFeed(out.parts[0].fig,out.total);
  const ratio=out.total/ACTIVE_BET;
  if(ratio>=8||jack){
   showBig(out.parts[0].fig,out.total,ratio>=50||jack?T('epic'):ratio>=20?T('mega'):T('big'),ratio>=50||jack?'epic':ratio>=20?'mega':'');
   if(ratio>=20||jack){flash('#ffd75e');goldRain();}
   burst('#ffd75e',ratio>=20?60:30);hapOk();
  } else {toast('+'+fmt(out.total)+'$');hap('medium');}
 } else if(!out.scatter&&!out.bonus){
  S.fever=Math.min(100,S.fever+(out.near?7:10));
 }
 updateHUD();save();
}

function updateHUD(){
 $('balVal').textContent=fmt(S.balance);
 $('poolVal').textContent=fmt(S.pool);
 $('betVal').textContent=S.bet;
 $('feverBar').style.width=S.fever+'%';
 $('feverWrap').classList.toggle('full',S.fever>=100);
 const sb=$('spinBtn');
 sb.disabled=S.spinning||(S.free===0&&S.balance<S.bet);
 sb.textContent=(S.free>0?'★ ':'')+T('spin')+' '+fmt(S.free>0?S.freeBet:S.bet)+'$';
 sb.classList.toggle('ready',!S.spinning);
 $('turboBtn').classList.toggle('on',S.turbo);
 $('freeChip').classList.toggle('hidden',S.free===0);
 $('freeVal').textContent=S.free;
 document.querySelectorAll('.autoBtn').forEach(b=>b.classList.toggle('on',S.auto>0&&+b.dataset.auto!==0));
}

async function spin(){
 if(S.spinning)return;
 const isFree=S.free>0;
 ACTIVE_BET=isFree?S.freeBet:S.bet;
 if(!isFree&&S.balance<S.bet){if(S.auto>0)S.auto=0;toast(T('noFunds'));updateHUD();return;}
 S.spinning=true;
 if(isFree)S.free--;
 else{S.balance-=S.bet;S.stats.spent+=S.bet;S.bank+=S.bet*BANK_CUT_RATIO;S.pool+=S.bet*POOL_CUT_RATIO;}
 S.stats.spins++;
 updateHUD();
 const out=pickOutcome();
 G=buildGrid(out);
 hap('light');
 await playSpin(out);
 applyOutcome(out);
 S.spinning=false;updateHUD();
 if(S.auto>0){S.auto--;updateHUD();setTimeout(spin,S.turbo?80:250);}
}

function changeBet(d){S.betIdx=clamp(S.betIdx+d,0,BET_LEVELS.length-1);S.bet=BET_LEVELS[S.betIdx];updateHUD();save();}
$('betDown').onclick=()=>changeBet(-1);
$('betUp').onclick=()=>changeBet(1);

function openBonusGame(){
 const b=ACTIVE_BET;
 const pool=[2,3,5,8,15,25].sort(()=>Math.random()-.5).slice(0,3);
 const bx=$('bonusBoxes');bx.innerHTML='';
 pool.forEach(m=>{const btn=document.createElement('button');btn.className='bbox';btn.textContent='🎁';
  btn.onclick=()=>{if(btn.classList.contains('open'))return;
   bx.querySelectorAll('.bbox').forEach(x=>x.style.pointerEvents='none');
   btn.classList.add('open');btn.textContent='x'+m;
   const prize=+(b*m).toFixed(2);
   S.balance+=prize;S.stats.won+=prize;S.bank=Math.max(0,S.bank-prize);
   flash('#ffd75e');burst('#ffd75e',50);goldRain();hapOk();
   addWinFeed(BN,prize);updateHUD();save();
   setTimeout(()=>{$('bonusModal').classList.remove('open');toast('+'+fmt(prize)+'$');},1100);};
  bx.appendChild(btn);});
 $('bonusModal').classList.add('open');
}

function buildPaytable(){const c=$('paytable');c.innerHTML='';
 for(let t=10;t>=1;t--){const f=PACK[t][0];const el=document.createElement('div');el.className='pt-row';
  el.innerHTML='<div class="pt-face">'+imgTag(f)+'</div><div class="pt-val">'+(t===10?'JACKPOT':'x'+TIER_BASE[t]+'–x'+(TIER_BASE[t]*10))+'</div>';
  el.onclick=()=>showTierModal(t);c.appendChild(el);}}
function showTierModal(t){
 $('tmTitle').textContent=T('level')+' '+t+' · '+T('cluster');
 $('tmRows').innerHTML=PACK[t].map(f=>'<div class="pool-row">'+imgTag(f)+'<div><div class="pr-name">'+(S.lang==='ru'?f.n:f.e)+'</div><div class="pr-alias">'+T('chance')+' 1/'+PACK[t].length+'</div></div><div style="margin-left:auto;font-family:\'Russo One\';color:var(--gold)">'+(t===10?'POOL':'x'+TIER_BASE[t])+'</div></div>').join('')
 +'<div class="pool-row" style="justify-content:center;font-size:10px;color:var(--dim)">5→x1 · 8→x2 · 10→x3.2 · 12→x5 · 15→x10</div>';
 $('tmClose').textContent=T('close');
 $('tierModal').classList.add('open');
}

const QUESTS=[{id:'q1',need:50,reward:20},{id:'q2',need:3,reward:30},{id:'q3',need:1,reward:50}];
function openQuests(){
 $('questRows').innerHTML=QUESTS.map(q=>{
  const prog=Math.min(S.qprog[q.id],q.need),done=prog>=q.need,claimed=!!S.qclaim[q.id];
  return '<div class="q-row"><div class="q-txt">'+T(q.id)+'<br><span style="color:var(--gold);font-family:\'Russo One\';font-size:9px">+'+q.reward+'$</span></div><div class="q-prog">'+prog+'/'+q.need+'</div><button class="q-claim" data-q="'+q.id+'" '+(done&&!claimed?'':'disabled')+'>'+(claimed?'✓':T('claim'))+'</button></div>';
 }).join('');
 $('qmClose').textContent=T('close');
 $('questModal').classList.add('open');
}
$('questRows').addEventListener('click',e=>{
 const b=e.target.closest('.q-claim');if(!b||b.disabled)return;
 const q=QUESTS.find(x=>x.id===b.dataset.q);
 S.qclaim[q.id]=1;S.balance+=q.reward;toast('+'+q.reward+'$');flash('#3ecf8e');
 updateHUD();save();openQuests();
});

const PROMOS={KAMALA25:25,PUTIN50:50,TRUMP100:100,ELON77:77,TIKTOK30:30};
$('promoGo').onclick=()=>{
 const code=($('promoInput').value||'').trim().toUpperCase();
 if(!PROMOS[code]||S.usedPromos.includes(code)){toast(T('promoBad'));return;}
 S.usedPromos.push(code);S.balance+=PROMOS[code];
 toast(T('promoOk')+' +'+PROMOS[code]+'$');flash('#3ecf8e');
 $('promoModal').classList.remove('open');updateHUD();save();
};

$('shareBtn').onclick=async()=>{
 const txt='🔥 GOLDEN POLIT SLOTS 6×6: ТРАМП, ПУТИН, КАМАЛА — собери кластер и занеси! Я выиграл '+fmt(S.stats.won)+'$ 👉 '+location.href;
 try{
  if(navigator.share)await navigator.share({text:txt});
  else await navigator.clipboard.writeText(txt);
  if(S.sharedDate!==today()){S.sharedDate=today();S.free+=5;toast(T('shared'));}
  updateHUD();save();
 }catch(e){}
};

function checkDaily(){
 const t=today();if(S.dailyLast===t)return;
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 const streak=(S.dailyLast===y)?S.dailyStreak+1:1;
 const reward=20+Math.min(streak,7)*10;
 S._pendingDaily={streak,reward};
 $('dailyStreak').textContent=streak;
 $('dailyReward').textContent='+'+reward+'$';
 setTimeout(()=>$('dailyModal').classList.add('open'),600);
}
$('dailyClaim').onclick=()=>{
 const p=S._pendingDaily;if(!p)return;
 S.balance+=p.reward;S.dailyLast=today();S.dailyStreak=p.streak;S._pendingDaily=null;
 $('dailyModal').classList.remove('open');
 toast('+'+p.reward+'$');flash('#ffd75e');burst('#ffd75e',40);
 updateHUD();save();
};

function applyLang(){
 document.querySelectorAll('[data-k]').forEach(el=>el.textContent=T(el.dataset.k));
 $('langBtn').textContent=S.lang==='ru'?'EN':'RU';
 updateHUD();
}
$('langBtn').onclick=()=>{S.lang=S.lang==='ru'?'en':'ru';save();applyLang();};

document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));
$('spinBtn').onclick=spin;
$('turboBtn').onclick=()=>{S.turbo=!S.turbo;updateHUD();save();};
document.querySelectorAll('.autoBtn').forEach(b=>b.onclick=()=>{
 const n=+b.dataset.auto;
 if(n===0||S.auto>0){S.auto=0;updateHUD();return;}
 S.auto=n;updateHUD();spin();
});
$('topUpBtn').onclick=()=>{S.balance+=100;toast('+100 USDT (demo)');updateHUD();save();};
$('walletBtn').onclick=()=>toast(T('demo'));
$('questBtn').onclick=openQuests;
$('promoBtn').onclick=()=>{$('pmClose2').textContent=T('close');$('promoModal').classList.add('open');};

buildPaytable();
G=buildGrid({parts:[],scatter:0,bonus:0,near:null});
renderGrid('drop');
applyLang();updateHUD();checkDaily();
</script>
</body>
</html>
