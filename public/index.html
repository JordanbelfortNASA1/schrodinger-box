<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GOLDEN POLIT BOX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5.2.5/index.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.2.5/400.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.2.5/700.css');
:root{--bg:#0b0e14;--panel:#151a22;--line:#2a3242;--white:#e8edf5;--dim:#7d8798;--org:#ff6a00;--red:#e23b3b;--gold:#ffd75e;--ok:#3ecf8e;--ton:#0098ea}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(90% 90% at 50% 40%,#1a2130 0%,#0b0e14 70%);color:var(--white);font-family:'Rubik',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-font-smoothing:antialiased}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
img{-webkit-user-drag:none;user-select:none}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:4px 6px calc(4px + env(safe-area-inset-bottom));overflow:hidden}
#app.shake{animation:shake .32s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,3px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(4px,2px)}75%{transform:translate(-2px,1px)}}
#titlebar{display:flex;justify-content:center;padding:2px 0;flex-shrink:0}
.tframe{font-family:'Russo One';font-size:14px;letter-spacing:3px;color:var(--gold);padding:5px 22px;border:2px solid #a87b1a;outline:1px solid #5a4310;outline-offset:2px;border-radius:6px;background:linear-gradient(180deg,#2a2008,#171204);box-shadow:0 0 14px rgba(255,215,94,.3),inset 0 0 10px rgba(255,215,94,.15);text-shadow:0 0 8px rgba(255,215,94,.7)}
#topbar{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:2px 2px}
#langBox{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px;flex-shrink:0}
.lang-opt{font-family:'Russo One';font-size:9px;letter-spacing:1px;color:var(--dim);padding:4px 7px;border-radius:4px;cursor:pointer;transition:.18s;border:none;background:transparent}
.lang-opt.on{color:#0b0e14;background:linear-gradient(180deg,var(--gold),#d9a92e);box-shadow:0 0 8px rgba(255,215,94,.5)}
.lang-opt:not(.on):active{transform:scale(.92)}
#modeBadge{font-family:'Russo One';font-size:8px;letter-spacing:1px;padding:4px 8px;border-radius:10px;border:1px solid var(--org);color:var(--org);flex-shrink:0}
#modeBadge.live{border-color:var(--ok);color:var(--ok);box-shadow:0 0 8px rgba(62,207,142,.4)}
#feedTxt{flex:1;text-align:center;color:#ff2a2a;font-size:10px;font-weight:700;letter-spacing:.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 0 8px rgba(255,42,42,.4);transition:opacity .4s}
.tb-emblem{color:var(--gold);font-size:13px;text-shadow:0 0 8px rgba(255,215,94,.6)}
#main{flex:1;display:flex;gap:6px;min-height:0}
#prizes{width:156px;flex-shrink:0;overflow-y:auto;position:relative;padding:4px 2px 10px 0;scrollbar-width:none}
#prizes::-webkit-scrollbar{display:none}
.pz{position:relative;cursor:pointer;margin:0 0 10px;border-radius:14px}
.pz:active{transform:scale(.92)}
.pz img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:2px solid var(--c);box-shadow:0 0 10px var(--c),0 3px 6px rgba(0,0,0,.6)}
#machine{flex:1;display:flex;flex-direction:column;min-width:0}
#drum{position:relative;height:132px;flex-shrink:0;margin:0 4px}
#drum::before,#drum::after{content:'';position:absolute;top:6px;bottom:33px;width:5px;background:linear-gradient(90deg,#7d8798,#2b3240);z-index:3;border-radius:2px}
#drum::before{left:-3px}#drum::after{right:-3px}
.drum-cap{position:absolute;top:0;left:0;right:0;height:14px;border-radius:50%/100% 100% 0 0;background:linear-gradient(180deg,#8a93a3,#3a4150 60%,#22272f);z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.drum-glass{position:absolute;top:7px;left:0;right:0;height:60px;border-radius:6px;overflow:hidden;background:radial-gradient(50% 70% at 88% 55%,rgba(226,59,59,.30),transparent 60%),radial-gradient(50% 70% at 12% 55%,rgba(47,107,255,.30),transparent 60%),linear-gradient(180deg,#2a3550,#141a26);box-shadow:inset 0 8px 20px rgba(0,0,0,.85),inset 0 -6px 14px rgba(0,0,0,.6)}
.drum-glass::before{content:'';position:absolute;left:4%;right:4%;top:0;bottom:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 40%,transparent 47%,transparent 60%,rgba(255,255,255,.07) 68%,transparent 75%);pointer-events:none;z-index:2}
#drumPile{position:absolute;inset:0}
.mc{position:absolute;will-change:transform}
.mc.tumble{animation:tumbleOnce 1s ease-in-out}
@keyframes tumbleOnce{50%{transform:rotate(80deg) translateY(-5px)}100%{transform:rotate(0)}}
.mc.falling{animation:cubeFall .5s ease-in forwards}
@keyframes cubeFall{to{transform:translateY(60px) rotate(40deg);opacity:0}}
.mcf{position:absolute;inset:0;border-radius:4px;border:1px solid var(--ke);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 14%,rgba(0,0,0,.45) 92%),repeating-linear-gradient(0deg,var(--k1) 0 5px,var(--k2) 5px 6px);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.mcf::after{content:'POLIT BOX';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Russo One';font-size:5px;letter-spacing:.5px;text-shadow:0 0 4px rgba(255,215,94,.6)}
.drum-band{position:absolute;top:67px;left:-3px;right:-3px;height:30px;background:linear-gradient(180deg,#8a93a3,#4a5261 30%,#2b3240 60%,#6b7686);border-top:1px solid #c8d0dc;border-bottom:1px solid #12161e;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Russo One';font-size:11px;letter-spacing:2px;color:#f4f7fc;text-shadow:0 1px 0 #000;z-index:2;white-space:nowrap}
.band-star{color:var(--red);font-size:10px}
.drum-base{position:absolute;top:97px;left:0;right:0;bottom:0;background:linear-gradient(180deg,#3a4150,#22272f);border-radius:0 0 8px 8px;box-shadow:inset 0 4px 8px rgba(0,0,0,.5)}
.drum-base::before{content:'';position:absolute;left:8px;right:8px;top:50%;height:4px;transform:translateY(-50%);background:radial-gradient(4px 4px at 8px 2px,#7d8798 40%,transparent 45%) repeat-x;background-size:24px 4px}
#mbody{display:flex;gap:6px;justify-content:center;align-items:stretch;margin-top:5px;flex:1;min-height:0}
.disp-col{display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;width:84px}
.disp{background:#1a1208;border:1px solid #4a3316;border-radius:3px;padding:3px 4px;text-align:center}
.dl{font-size:7px;color:#8a6a40;letter-spacing:1px}
.dv{font-family:'Russo One';font-size:12px;color:var(--org);text-shadow:0 0 8px rgba(255,106,0,.7)}
#tube{display:flex;flex-direction:column;gap:3px;width:100px}
.slot{flex:1;position:relative;background:#0a0d14;border:1px solid #3a4356;border-radius:4px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.slot .box{position:absolute;inset:2px}
#jack{text-align:center;margin:4px 0 2px;font-size:9px;letter-spacing:2px;color:var(--dim)}
#jack b{font-family:'Russo One';font-size:15px;color:var(--org);text-shadow:0 0 10px rgba(255,106,0,.8)}
#btns{display:flex;gap:8px;flex-shrink:0;padding-bottom:2px}
.bpanel{flex:1;background:linear-gradient(180deg,#2a303c,#1a1f28);border:1px solid var(--line);border-radius:8px;padding:5px 6px 6px}
.blab{font-size:8px;letter-spacing:2px;color:var(--dim);text-align:center;margin-bottom:4px}
.screen-btn{width:100%;height:44px;border-radius:6px;border:2px solid #000;cursor:pointer;background:radial-gradient(80% 100% at 50% 50%,#ff9a4d,#ff4d00 55%,#7a1f00);box-shadow:0 0 16px rgba(255,90,0,.55),inset 0 0 12px rgba(255,255,255,.3);transition:transform .08s,box-shadow .08s}
.screen-btn:active{transform:translateY(2px);box-shadow:0 0 8px rgba(255,90,0,.4),inset 0 0 8px rgba(255,255,255,.2)}
.screen-btn:disabled{filter:grayscale(.8) brightness(.4);pointer-events:none}
.screen-btn.ready{animation:scrPulse 1.2s infinite}
@keyframes scrPulse{50%{box-shadow:0 0 28px rgba(255,90,0,.9),inset 0 0 14px rgba(255,255,255,.4)}}
.bsub{font-size:8px;font-weight:700;color:var(--org);text-align:center;margin-top:3px;letter-spacing:.5px}
.k-black{--k1:#20242c;--k2:#0d0f13;--ke:#4a5261}
.crate{position:absolute;inset:0}
.cfront{position:absolute;inset:0;border-radius:6px;border:1px solid var(--ke);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 14%,rgba(0,0,0,.4) 92%),repeating-linear-gradient(0deg,var(--k1) 0 8px,var(--k2) 8px 9px)}
.cfront::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 44%,rgba(0,0,0,.35) 44% 56%,transparent 56%)}
.half{position:absolute;top:0;bottom:0;width:51%;transition:transform .7s cubic-bezier(.4,1.2,.5,1);z-index:2;background:repeating-linear-gradient(0deg,var(--k1) 0 8px,var(--k2) 8px 9px);display:flex;align-items:center;justify-content:center}
.half.hl{left:0;border-radius:6px 0 0 6px;border-right:1px solid #0a0d14}
.half.hr{right:0;border-radius:0 6px 6px 0;border-left:1px solid #0a0d14}
.half.hl::after{content:'GOLDEN';font-family:'Russo One';font-size:7px;color:var(--gold);letter-spacing:1px;text-shadow:0 0 6px rgba(255,215,94,.6)}
.half.hr::after{content:'POLIT BOX';font-family:'Russo One';font-size:6px;color:var(--gold);letter-spacing:.5px;text-shadow:0 0 6px rgba(255,215,94,.6)}
.box.split .hl{transform:translateX(-82%) rotate(-6deg)}
.box.split .hr{transform:translateX(82%) rotate(6deg)}
.box.ceremony .cfront{animation:slowShake 1s ease-in-out;box-shadow:0 0 24px var(--c)}
@keyframes slowShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
.cinner{position:absolute;inset:2px;border-radius:4px;overflow:hidden;background:#0b0e14;z-index:1;display:flex;align-items:center;justify-content:center}
img.ci-face{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s;background:#0b0e14}
.box.split img.ci-face{opacity:1}
.box.land .cfront{animation:squash .32s}
@keyframes squash{0%{transform:scale(1.08,.86)}55%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
.box.gone{transition:opacity .4s;opacity:0}
#fallLayer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fallbox{position:absolute;transition:top .55s cubic-bezier(.5,0,.35,1.15),transform .55s;transform:rotate(-7deg) scale(.96)}
.fallbox.drop{transform:rotate(0) scale(1)}
.fallbox .crate{transform:none}
#stage{position:absolute;inset:0;pointer-events:none;z-index:60}
.bigfig{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;animation:bfIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bfIn{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}}
.bigfig.out{transition:.4s;opacity:0;transform:translate(-50%,-50%) scale(1.12)}
.bf-beam{position:absolute;left:50%;top:50%;width:170px;height:300px;transform:translate(-50%,-50%);background:linear-gradient(180deg,transparent,var(--c) 30%,var(--c) 70%,transparent);opacity:.18}
.bf-rays{position:absolute;left:50%;top:70px;width:220px;height:220px;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,255,255,.30) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(closest-side,#000,transparent 72%);mask:radial-gradient(closest-side,#000,transparent 72%)}
img.bf-face{width:clamp(120px,45vw,190px);height:clamp(120px,45vw,190px);border-radius:50%;border:4px solid var(--c);object-fit:cover;box-shadow:0 0 34px var(--c);background:#0b0e14;position:relative}
.bf-name{font-family:'Russo One';font-size:17px;text-shadow:0 0 12px var(--c),0 2px 4px #000}
.bf-prize{font-family:'Russo One';font-size:26px;color:var(--c);text-shadow:0 0 16px var(--c)}
.bf-tier{font-size:10px;letter-spacing:2px;color:var(--dim)}
#wins{display:flex;gap:5px;overflow-x:auto;padding:3px 0;min-height:28px;flex-shrink:0;scrollbar-width:none}
#wins::-webkit-scrollbar{display:none}
.wc{flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--c);border-radius:14px;padding:3px 9px;font-size:10px;font-weight:700;color:var(--c);animation:popIn .35s cubic-bezier(.3,1.5,.5,1)}
.wc img{width:18px;height:18px;border-radius:50%;object-fit:cover}
@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#botbar{display:flex;align-items:center;gap:6px;flex-shrink:0;background:linear-gradient(180deg,#1a2029,#12161e);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.bb-player{font-size:8px;color:var(--dim);letter-spacing:.5px;max-width:70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bb-bal{font-family:'Russo One';font-size:17px;color:#7fd4ff;white-space:nowrap}
.bb-bal b{color:var(--white)}
.bb-wallet{background:linear-gradient(180deg,#29b6f6,#0077c2);border:1px solid #7fd4ff;border-radius:5px;color:#fff;font-family:'Russo One';font-size:8px;letter-spacing:1px;padding:8px 9px;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 0 8px rgba(0,152,234,.4)}
.bb-wallet.on{background:linear-gradient(180deg,#173a52,#0d2436);border-color:var(--ton);color:#7fd4ff}
.bb-wallet:active{transform:scale(.95)}
.bb-add{background:linear-gradient(180deg,#ff7a2a,#e24d00);border:1px solid #ffb380;border-radius:5px;color:#fff;font-family:'Russo One';font-size:8px;letter-spacing:1px;padding:8px 9px;cursor:pointer;margin-left:auto}
.bb-add:active{transform:scale(.95)}
.mini-btn{background:var(--panel);border:1px solid var(--line);color:var(--white);border-radius:6px;padding:4px 7px;font-size:12px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(2,4,8,.88);padding:16px}
.modal.open{display:flex}
.modal-card{width:100%;max-width:400px;max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#151c2c,#0d1119);border:1px solid var(--line);border-radius:16px;padding:16px;animation:popIn .35s cubic-bezier(.3,1.4,.5,1)}
.m-title{font-family:'Russo One';text-align:center;font-size:18px;margin-bottom:12px}
.pool-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:7px;border:1px solid var(--line)}
img.pr-face{width:48px;height:48px;border-radius:9px;object-fit:cover;border:1px solid var(--line);background:#1a2338}
.pr-name{font-family:'Russo One';font-size:12px}
.pr-alias{font-size:8px;letter-spacing:1px;color:var(--dim)}
.m-btn{width:100%;font-family:'Russo One';font-size:14px;padding:12px;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,var(--red),#8e1f1f);color:#fff;border:1px solid #ff8080;margin-top:8px}
.m-btn.ton{background:linear-gradient(180deg,#29b6f6,#0077c2);border-color:#7fd4ff}
.m-btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.wm-addr{font-family:'Russo One';font-size:11px;color:#7fd4ff;text-align:center;margin-bottom:6px;word-break:break-all}
.wm-row{display:flex;gap:8px}
.wm-row input{flex:1;background:#0a0d14;border:1px solid #3a4356;border-radius:8px;color:var(--white);font-family:'Russo One';font-size:14px;padding:10px;text-align:center;outline:none;min-width:0}
.wm-row .m-btn{margin-top:0;width:auto;padding:10px 14px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:#1c2436;border:1px solid var(--line);color:var(--white);padding:9px 16px;border-radius:10px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:120;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:479px){
 .disp-col{width:64px}
 #tube{width:78px}
 #mbody{gap:4px}
 .dv{font-size:10px}
 .dl{font-size:5px}
 .bb-player{display:none}
 #prizes{width:150px}
}
@media (max-width:399px){
 .disp-col{width:56px}
 #tube{width:68px}
 .dv{font-size:9px}
 #prizes{width:142px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <div id="titlebar"><span class="tframe">★ GOLDEN POLIT BOX ★</span></div>
  <div id="topbar">
    <div id="langBox">
      <button class="lang-opt" data-lang="en">EN</button>
      <button class="lang-opt" data-lang="ru">RU</button>
    </div>
    <span id="modeBadge">DEMO</span>
    <span id="feedTxt"></span>
    <span class="tb-emblem">★</span>
  </div>
  <div id="main">
    <div id="prizes"></div>
    <div id="machine">
      <div id="drum">
        <div class="drum-cap"></div>
        <div class="drum-glass"><div id="drumPile"></div></div>
        <div class="drum-band"><span class="band-star">✦</span>GOLDEN POLIT BOX<span class="band-star">✦</span></div>
        <div class="drum-base"></div>
      </div>
      <div id="mbody">
        <div class="disp-col">
          <div class="disp"><div class="dl" data-k="d5set"></div><div class="dv">4.00</div></div>
          <div class="disp"><div class="dl" data-k="d3set"></div><div class="dv">4.50</div></div>
          <div class="disp"><div class="dl" data-k="d1set"></div><div class="dv">5.00</div></div>
        </div>
        <div id="tube">
          <div class="slot" data-i="4"></div><div class="slot" data-i="3"></div><div class="slot" data-i="2"></div><div class="slot" data-i="1"></div><div class="slot" data-i="0"></div>
        </div>
        <div class="disp-col">
          <div class="disp"><div class="dl" data-k="d4set"></div><div class="dv">4.25</div></div>
          <div class="disp"><div class="dl" data-k="d2set"></div><div class="dv">4.75</div></div>
          <div class="disp"><div class="dl" data-k="djack"></div><div class="dv">≥100</div></div>
        </div>
      </div>
      <div id="jack"><span data-k="jackPool"></span> <b id="poolVal">100.00</b></div>
      <div id="btns">
        <div class="bpanel"><div class="blab" data-k="buyLab"></div><button class="screen-btn" id="buyBtn"></button><div class="bsub" id="buySub"></div></div>
        <div class="bpanel"><div class="blab" data-k="openLab"></div><button class="screen-btn" id="openBtn"></button><div class="bsub" id="openSub"></div></div>
      </div>
    </div>
  </div>
  <div id="wins"></div>
  <div id="botbar">
    <span class="bb-player" data-k="player"></span>
    <span class="bb-bal"><b id="balVal">100.00</b> USDT</span>
    <button class="bb-wallet" id="walletBtn"></button>
    <button class="mini-btn" id="muteBtn">🔊</button>
    <button class="bb-add" id="topUpBtn" data-k="topUp"></button>
  </div>
  <div id="fallLayer"></div>
  <div id="stage"></div>
</div>
<div class="modal" id="poolModal"><div class="modal-card"><div class="m-title" id="pmTitle"></div><div id="pmRows"></div><button class="m-btn" data-close id="pmClose"></button></div></div>
<div class="modal" id="walletModal"><div class="modal-card">
  <div class="m-title" id="wmTitle"></div>
  <div class="wm-addr" id="wmAddr"></div>
  <div class="wm-row"><input id="wdAmount" type="number" min="1" step="0.01" placeholder="0.00"><button class="m-btn" id="wdBtn"></button></div>
  <button class="m-btn ton" id="depBtn"></button>
  <button class="m-btn ghost" id="disBtn"></button>
  <button class="m-btn" data-close id="wmClose"></button>
</div></div>
<div id="toast"></div>
<script>
'use strict';
const TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();}catch(e){}}

 const land=()=>{if(done)return;done=true;f.remove();el.style.opacity='1';el.classList.add('land');sfxDrop();shake();const rc=el.getBoundingClientRect();dust(rc.left+rc.width/2,rc.bottom);setTimeout(()=>el.classList.remove('land'),350);};
 requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.top=yEnd+'px';f.classList.add('drop');}));
 f.addEventListener('transitionend',land,{once:true});setTimeout(land,750);
}
function createBoxNode(idx,delay){
 const el=document.createElement('div');el.className='box k-black';
 el.innerHTML='<div class="crate"><div class="cfront"><div class="cinner"></div><div class="half hl"></div><div class="half hr"></div></div></div>';
 el.style.opacity='0';slotFor(idx).appendChild(el);
 setTimeout(()=>spawnFall(el,idx),20+(delay||0));
 return el;}
async function buyOne(){if(S.opening)return false;if(S.boxes.length>=5){toast(T('toastTube'));return false;}const price=PRICE[S.boxes.length];
 if(MODE==='server'){try{const j=await api('/buy',{method:'POST'});S.balance=j.balance;S.pool=j.pool;}catch(e){toast(T('apiErr'));return false;}}
 else{if(S.balance<price){toast(T('toastNoFunds'));return false;}S.balance-=price;S.stats.spent+=price;S.pool+=POOL_ADD;}
 drumHot();hap('light');const node=createBoxNode(S.boxes.length,0);S.boxes.push({node,price});updateHUD();save();return true;}
const FNAMES=['MIKE','ANON','WHALE','IVAN','KRYPTO','SAM','LEX','TRADER','GIGA','DIEGO'];
function addWin(fig,t,prize,who){const d=$('wins');const el=document.createElement('div');el.className='wc';el.style.setProperty('--c',TIER_COLORS[t]);
 el.innerHTML=face(fig,'')+'<span>'+(who||('***'+FNAMES[Math.floor(Math.random()*FNAMES.length)]))+' +'+fmt(prize)+'$</span>';
 d.insertBefore(el,d.firstChild);while(d.children.length>8)d.removeChild(d.lastChild);}
function setFeed(txt){const f=$('feedTxt');f.style.opacity=0;setTimeout(()=>{f.textContent=txt;f.style.opacity=1;},350);}
let fi=0;setInterval(()=>{fi=(fi+1)%T('feeds').length;setFeed(T('feeds')[fi]);},6000);
setInterval(()=>{const t=rollTier();const pool=PACK[t];const fig=pool[Math.floor(Math.random()*pool.length)];addWin(fig,t,PRIZES[t]);if(t>=7)setFeed(T('hitFeed')(FNAMES[Math.floor(Math.random()*FNAMES.length)],T('tierNames')[t],fmt(PRIZES[t])));},5000);
function showBig(r){const c=TIER_COLORS[r.t];const el=document.createElement('div');el.className='bigfig';el.style.setProperty('--c',c);
 el.innerHTML='<div class="bf-beam"></div><div class="bf-rays"></div>'+face(r.fig,'bf-face')+'<div class="bf-name">'+fname(r.fig)+'</div><div class="bf-prize">+'+fmt(r.prize)+' $</div><div class="bf-tier">'+T('level')+' '+r.t+' · '+T('tierNames')[r.t]+'</div>';
 $('stage').appendChild(el);setTimeout(()=>el.classList.add('out'),1300);setTimeout(()=>el.remove(),1750);}
function ceremonyOpen(b,r){const node=b.node,c=TIER_COLORS[r.t];node.style.setProperty('--c',c);
 node.querySelector('.cinner').innerHTML=face(r.fig,'ci-face');
 node.classList.add('ceremony');sfxCeremony(r.t);
 const build=r.t>=8?950:650;
 setTimeout(()=>{node.classList.add('split');sfxSplit();},build);
 setTimeout(()=>{showBig(r);sfxReveal();if(r.t>=7)hapOk();const rc=node.getBoundingClientRect();burst(rc.left+rc.width/2,rc.top+rc.height/2,c,14+r.t*2,6+r.t);if(r.t>=9){goldRain();sfxJackpot();shake();}},build+450);}
async function openAll(){if(S.opening||S.boxes.length===0)return;S.opening=true;updateHUD();
 let results;
 if(MODE==='server'){try{const j=await api('/open',{method:'POST'});S.balance=j.balance;S.pool=j.pool;results=j.results.map(r=>({t:r.t,prize:r.prize,fig:PACK[r.t][r.fig||0]}));}catch(e){toast(T('apiErr'));S.opening=false;updateHUD();return;}}
 else{results=S.boxes.map(()=>openOneBox());}
 const total=results.reduce((s,r)=>s+r.prize,0);const n=S.boxes.length;const STAG=1500;
 S.boxes.forEach((b,i)=>setTimeout(()=>ceremonyOpen(b,results[i]),i*STAG));
 setTimeout(()=>{if(MODE!=='server'){S.balance+=total;S.stats.opened+=n;S.stats.won+=total;}
  countUp($('balVal'),+$('balVal').textContent,S.balance,700);
  results.slice().sort((a,b)=>b.t-a.t).forEach(r=>{addWin(r.fig,r.t,r.prize,T('you'));if(r.t>=7)setFeed(T('youFeed')(T('tierNames')[r.t],fmt(r.prize)));});
  const nodes=S.boxes.map(b=>b.node);S.boxes=[];S.opening=false;
  setTimeout(()=>{nodes.forEach(nd=>{nd.classList.add('gone');setTimeout(()=>nd.remove(),450);});},900);
  toast(T('toastTotal')+fmt(total)+' USDT');updateHUD();save();},(n-1)*STAG+2600);}
let tcUI=null;
function tcCls(){const w=window.TonConnectUI;return w?(w.TonConnectUI||w.default||w):null;}
function initTC(){const C=tcCls();if(!C)return;try{tcUI=new C({manifestUrl:CFG.MANIFEST});tcUI.onStatusChange(st=>{S.wallet=(st&&st.account)?st.account.address:null;renderWallet();});}catch(e){tcUI=null;}}
function renderWallet(){const b=$('walletBtn');if(S.wallet){b.textContent=shortAddr(S.wallet);b.classList.add('on');}else{b.textContent=T('connectWallet');b.classList.remove('on');}}
async function walletClick(){if(!tcUI){toast(T('noTc'));return;}if(S.wallet){fillWalletModal();$('walletModal').classList.add('open');syncBB();return;}try{await tcUI.openModal();}catch(e){toast(T('noTc'));}}
function fillWalletModal(){$('wmTitle').textContent=T('walletTitle');$('wmAddr').textContent=S.wallet||'';$('wdBtn').textContent=T('withdraw');$('depBtn').textContent=T('deposit');$('disBtn').textContent=T('disconnect');$('wmClose').textContent=T('close');}
async function doDeposit(){if(MODE!=='server'){toast(T('demoOnly'));return;}if(!tcUI||!S.wallet){toast(T('noTc'));return;}
 try{const j=await api('/deposit',{method:'POST',body:JSON.stringify({amountTon:CFG.DEPOSIT_TON})});
  await tcUI.sendTransaction({validUntil:Math.floor(Date.now()/1000)+600,messages:[{address:j.address,amount:j.amountNano||String(CFG.DEPOSIT_TON*1e9)}]});
  toast(T('txSent'));}catch(e){toast(T('txErr'));}}
async function doWithdraw(){if(MODE!=='server'){toast(T('demoOnly'));return;}const amt=parseFloat($('wdAmount').value);if(!amt||amt<=0)return;
 try{const j=await api('/withdraw',{method:'POST',body:JSON.stringify({amount:amt,address:S.wallet})});S.balance=j.balance;countUp($('balVal'),+$('balVal').textContent,S.balance,700);updateHUD();save();closeModals();}catch(e){toast(T('apiErr'));}}
function closeModals(){document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));syncBB();}
function syncBB(){try{if(TG&&TG.BackButton){if(document.querySelector('.modal.open'))TG.BackButton.show();else TG.BackButton.hide();}}catch(e){}}
if(TG&&TG.BackButton){try{TG.BackButton.onClick(closeModals);}catch(e){}}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals();}));
$('buyBtn').onclick=()=>buyOne();
$('openBtn').onclick=()=>openAll();
$('walletBtn').onclick=walletClick;
$('depBtn').onclick=doDeposit;
$('wdBtn').onclick=doWithdraw;
$('disBtn').onclick=()=>{if(tcUI){try{tcUI.disconnect();}catch(e){}}closeModals();};
$('topUpBtn').onclick=()=>{if(MODE==='server'){if(S.wallet)doDeposit();else walletClick();}else{const o=S.balance;S.balance+=100;countUp($('balVal'),o,S.balance);toast(T('toastTopUp'));updateHUD();save();}};
$('muteBtn').onclick=()=>{S.muted=!S.muted;$('muteBtn').textContent=S.muted?'🔇':'';save();};
$('muteBtn').textContent=S.muted?'🔇':'';
buildPrizes();buildPile();applyLang();renderWallet();initTC();detectMode();
