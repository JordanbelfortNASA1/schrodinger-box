<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GOLDEN POLIT SLOTS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5.2.5/index.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.2.5/400.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.2.5/700.css');

:root{
  --bg:#0b0e14;
  --panel:#151a22;
  --line:#2a3242;
  --white:#e8edf5;
  --dim:#7d8798;
  --org:#ff6a00;
  --red:#e23b3b;
  --gold:#ffd75e;
  --ok:#3ecf8e;
  --ton:#0098ea;
  --cell:92px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(90% 90% at 50% 30%,#1a2130 0%,#0b0e14 70%);
  color:var(--white);
  font-family:'Rubik',system-ui,sans-serif;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}

img{-webkit-user-drag:none;user-select:none}
button{font-family:inherit}

#app{
  position:relative;
  z-index:1;
  max-width:520px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  overflow:hidden;
  gap:6px;
}

#fx{
  position:fixed;
  inset:0;
  z-index:90;
  pointer-events:none;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  flex-shrink:0;
}

.title{
  font-family:'Russo One';
  font-size:13px;
  letter-spacing:2px;
  color:var(--gold);
  padding:6px 14px;
  border:2px solid #a87b1a;
  outline:1px solid #5a4310;
  outline-offset:2px;
  border-radius:8px;
  background:linear-gradient(180deg,#2a2008,#171204);
  box-shadow:0 0 14px rgba(255,215,94,.28), inset 0 0 10px rgba(255,215,94,.12);
  text-shadow:0 0 8px rgba(255,215,94,.65);
  white-space:nowrap;
}

.badges{
  display:flex;
  align-items:center;
  gap:6px;
}

.badge{
  font-family:'Russo One';
  font-size:9px;
  letter-spacing:1px;
  padding:5px 8px;
  border-radius:10px;
  border:1px solid var(--org);
  color:var(--org);
}

.pool-mini{
  font-family:'Russo One';
  font-size:10px;
  color:#7fd4ff;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:5px 8px;
  white-space:nowrap;
}

.machine{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

#reels{
  position:relative;
  height:calc(var(--cell) * 3);
  border-radius:18px;
  padding:8px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
    linear-gradient(180deg,#20283a,#101520);
  border:1px solid #3a4356;
  box-shadow:inset 0 0 30px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.35);
}

.reels-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  height:100%;
}

.reel{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:#0a0d14;
  border:1px solid #333d52;
  box-shadow:inset 0 8px 18px rgba(0,0,0,.65), inset 0 -8px 18px rgba(0,0,0,.5);
}

.reel::before,
.reel::after{
  content:'';
  position:absolute;
  left:0;
  right:0;
  height:var(--cell);
  z-index:3;
  pointer-events:none;
}

.reel::before{
  top:0;
  background:linear-gradient(180deg, rgba(4,6,10,.92), rgba(4,6,10,.18), transparent);
}

.reel::after{
  bottom:0;
  background:linear-gradient(0deg, rgba(4,6,10,.92), rgba(4,6,10,.18), transparent);
}

.strip{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  will-change:transform;
}

.sym{
  width:100%;
  height:var(--cell);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.sym img{
  width:calc(var(--cell) * .80);
  height:calc(var(--cell) * .80);
  border-radius:14px;
  object-fit:cover;
  border:2px solid #3a4356;
  background:#111622;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}

.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#232a38;
  border:1px solid #3a4356;
  color:var(--gold);
  font-family:'Russo One';
  letter-spacing:1px;
}

.sym .avatar{
  width:calc(var(--cell) * .80);
  height:calc(var(--cell) * .80);
  border-radius:14px;
  font-size:22px;
}

.wc .avatar{
  width:20px;
  height:20px;
  border-radius:50%;
  font-size:8px;
}

.bigfig .avatar{
  width:clamp(120px,42vw,180px);
  height:clamp(120px,42vw,180px);
  border-radius:50%;
  font-size:42px;
  border:4px solid var(--gold);
  box-shadow:0 0 30px rgba(255,215,94,.35);
}

#payline{
  position:absolute;
  left:8px;
  right:8px;
  top:calc(8px + var(--cell));
  height:var(--cell);
  z-index:4;
  pointer-events:none;
  border-top:2px solid rgba(255,215,94,.85);
  border-bottom:2px solid rgba(255,215,94,.85);
  box-shadow:0 0 20px rgba(255,215,94,.16), inset 0 0 18px rgba(255,215,94,.07);
}

#payline::before,
#payline::after{
  content:'▶';
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold);
  font-size:12px;
  text-shadow:0 0 8px rgba(255,215,94,.8);
}

#payline::before{left:-2px}
#payline::after{right:-2px; transform:translateY(-50%) scaleX(-1)}

.fever-wrap{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
}

.fever-label{
  font-family:'Russo One';
  font-size:10px;
  letter-spacing:2px;
  color:var(--dim);
}

.fever-track{
  flex:1;
  height:12px;
  border-radius:999px;
  background:#0a0d14;
  border:1px solid #333d52;
  overflow:hidden;
}

#feverBar{
  width:0%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#ff6a00,#ffd75e);
  box-shadow:0 0 14px rgba(255,106,0,.55);
  transition:width .25s ease;
}

.fever-wrap.full #feverBar{
  animation:feverPulse .7s infinite alternate;
}

@keyframes feverPulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.55)}
}

.controls{
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.controls-row{
  display:flex;
  gap:6px;
}

.btn{
  border:none;
  cursor:pointer;
  color:#fff;
  font-family:'Russo One';
  border-radius:12px;
  transition:transform .12s ease, filter .12s ease;
}

.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(.75) brightness(.45); pointer-events:none}

#spinBtn{
  flex:1;
  min-height:56px;
  font-size:20px;
  letter-spacing:1px;
  border:2px solid #000;
  background:
    radial-gradient(80% 120% at 50% 20%, rgba(255,255,255,.28), transparent 30%),
    linear-gradient(180deg,#ff9a4d,#ff4d00 55%,#7a1f00);
  box-shadow:0 0 22px rgba(255,90,0,.42), inset 0 0 14px rgba(255,255,255,.22);
}

#spinBtn.ready{
  animation:spinPulse 1.1s infinite;
}

@keyframes spinPulse{
  0%,100%{box-shadow:0 0 18px rgba(255,90,0,.35), inset 0 0 12px rgba(255,255,255,.2)}
  50%{box-shadow:0 0 34px rgba(255,90,0,.9), inset 0 0 18px rgba(255,255,255,.35)}
}

#turboBtn{
  width:92px;
  min-height:56px;
  font-size:13px;
  letter-spacing:1px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,#2a303c,#1a1f28);
  color:var(--dim);
}

#turboBtn.on{
  color:#fff;
  border-color:var(--gold);
  background:linear-gradient(180deg,#57400b,#2a2008);
  box-shadow:0 0 16px rgba(255,215,94,.35);
}

.auto-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.autoBtn{
  min-height:40px;
  font-size:11px;
  letter-spacing:1px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,#1c2230,#0f141c);
  color:var(--dim);
}

.autoBtn.on{
  color:#fff;
  border-color:var(--org);
  background:linear-gradient(180deg,#ff9a4d,#e24d00);
  box-shadow:0 0 14px rgba(255,106,0,.4);
}

#wins{
  flex-shrink:0;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:4px 0;
  min-height:34px;
  scrollbar-width:none;
}

#wins::-webkit-scrollbar{display:none}

.wc{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 10px;
  font-size:10px;
  font-weight:800;
  color:var(--gold);
  animation:popIn .3s cubic-bezier(.3,1.5,.5,1);
}

.wc img{
  width:20px;
  height:20px;
  border-radius:50%;
  object-fit:cover;
}

@keyframes popIn{
  from{transform:scale(.65); opacity:0}
  to{transform:scale(1); opacity:1}
}

.bottombar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(180deg,#1a2029,#12161e);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
}

.balance{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.balance small{
  font-size:9px;
  color:var(--dim);
  letter-spacing:2px;
}

#balVal{
  font-family:'Russo One';
  font-size:26px;
  line-height:1;
  color:#7fd4ff;
  text-shadow:0 0 16px rgba(127,212,255,.22);
  white-space:nowrap;
}

.bottom-actions{
  margin-left:auto;
  display:flex;
  gap:6px;
}

.walletBtn,
.topupBtn{
  border-radius:12px;
  font-family:'Russo One';
  font-size:11px;
  letter-spacing:1px;
  padding:13px 12px;
  cursor:pointer;
}

.walletBtn{
  background:linear-gradient(180deg,#29b6f6,#0077c2);
  border:1px solid #7fd4ff;
  color:#fff;
  box-shadow:0 0 14px rgba(0,152,234,.35);
}

.topupBtn{
  background:linear-gradient(180deg,#ff7a2a,#e24d00);
  border:1px solid #ffb380;
  color:#fff;
}

.bigfig{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:rgba(2,4,8,.82);
  backdrop-filter:blur(4px);
  animation:bigIn .25s ease;
  pointer-events:none;
}

@keyframes bigIn{
  from{opacity:0; transform:scale(.82)}
  to{opacity:1; transform:scale(1)}
}

.bigfig.hidden{display:none}

.bigfig img{
  width:clamp(120px,42vw,180px);
  height:clamp(120px,42vw,180px);
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--gold);
  box-shadow:0 0 34px rgba(255,215,94,.45);
  background:#0b0e14;
}

.big-name{
  font-family:'Russo One';
  font-size:22px;
  text-shadow:0 0 14px rgba(255,215,94,.4);
}

.big-prize{
  font-family:'Russo One';
  font-size:42px;
  color:var(--gold);
  text-shadow:0 0 24px rgba(255,215,94,.65);
}

.big-sub{
  font-size:10px;
  letter-spacing:3px;
  color:var(--dim);
}

#toast{
  position:fixed;
  left:50%;
  bottom:96px;
  transform:translateX(-50%) translateY(16px);
  background:#1c2436;
  border:1px solid var(--line);
  color:var(--white);
  padding:10px 16px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:130;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media (max-width:420px){
  :root{--cell:76px}
  .title{font-size:11px; padding:5px 10px}
  #balVal{font-size:23px}
  #spinBtn{font-size:17px}
}
</style>
</head>

</div>

<div id="toast"></div>

const BANK_CUT = 0.55;   // доля ставки, которая уходит в "банк проекта"
const POOL_CUT = 0.35;   // доля ставки в джекпот-пул
const TARGET_RTP = 0.85; // целевой возврат игроку

const WIN_PRIZE = {1:1.5,2:3,3:5,4:8,5:15,6:30,7:60,8:180,9:500};
const NEAR_PRIZE = {1:.35,2:.5,3:.65,4:.85,5:1.05,6:1.3,7:1.7,8:2.3,9:3.0};

const WIN_TIERS = [
  {t:9,w:4},{t:8,w:7},{t:7,w:8},{t:6,w:10},{t:5,w:12},
  {t:4,w:14},{t:3,w:14},{t:2,w:16},{t:1,w:15}
];

const NEAR_TIERS = [
  {t:8,w:5},{t:7,w:8},{t:6,w:10},{t:5,w:14},
  {t:4,w:16},{t:3,w:18},{t:2,w:16},{t:1,w:13}
];

const FEVER_TIERS = [
  {t:9,w:8},{t:8,w:14},{t:7,w:18},{t:6,w:25},{t:5,w:35}
];

const VISUAL_TIERS = [
  {t:1,w:28},{t:2,w:20},{t:3,w:15},{t:4,w:12},
  {t:5,w:9},{t:6,w:7},{t:7,w:4},{t:8,w:3},{t:9,w:2}
];

const KEY = 'gp_slots_v1';

const S = {
  balance: 100,
  pool: 100,
  bank: 1000,
  fever: 0,
  turbo: false,
  spinning: false,
  auto: 0,
  stats: {
    spins: 0,
    spent: 0,
    won: 0
  }
};

try{
  const raw = localStorage.getItem(KEY);
  if(raw){
    const saved = JSON.parse(raw);
    S.balance = saved.balance ?? S.balance;
    S.pool = saved.pool ?? S.pool;
    S.bank = saved.bank ?? S.bank;
    S.fever = saved.fever ?? 0;
    S.turbo = !!saved.turbo;
    S.stats = saved.stats || S.stats;
  } else {
    const oldRaw = localStorage.getItem('sbx_v7') || localStorage.getItem('sbx_v6');
    if(oldRaw){
      const old = JSON.parse(oldRaw);
      S.balance = old.balance ?? S.balance;
      S.pool = old.pool ?? S.pool;
    }
  }
}catch(e){}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      balance:S.balance,
      pool:S.pool,
      bank:S.bank,
      fever:S.fever,
      turbo:S.turbo,
      stats:S.stats
    }));
  }catch(e){}
}

function abbr(name){
  return name.split(' ').map(x => x[0]).join('').slice(0,2).toUpperCase();
}

function imgTag(fig){
  return `<img src="${fig.img}" data-abbr="${abbr(fig.e)}" alt="" loading="lazy">`;
}

// fallback если фотка не загрузилась
document.addEventListener('error', e => {
  const el = e.target;
  if(!el || el.tagName !== 'IMG' || !el.dataset.abbr) return;
  const div = document.createElement('div');
  div.className = 'avatar';
  div.textContent = el.dataset.abbr;
  el.replaceWith(div);
}, true);

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

function weighted(arr){
  const total = arr.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  for(const x of arr){
    if(r < x.w) return x.t;
    r -= x.w;
  }
  return arr[0].t;
}

function randomFigFromTier(t){
  const arr = PACK[t];
  return arr[Math.floor(Math.random()*arr.length)];
}

function randomFig(){
  return randomFigFromTier(weighted(VISUAL_TIERS));
}

function randomFigNot(except){
  for(let i=0;i<25;i++){
    const f = randomFig();
    if(!except || f.e !== except.e) return f;
  }
  return PACK[1][0];
}

function currentRTP(){
  if(S.stats.spent < 20) return TARGET_RTP - 0.03;
  return S.stats.won / S.stats.spent;
}

function makeGrid(center){
  return [0,1,2].map(i => {
    const top = randomFigNot(center[i]);
    let bottom = randomFigNot(center[i]);
    if(top.e === bottom.e) bottom = randomFigNot(center[i]);
    return [top, center[i], bottom];
  });
}

function createJackpot(){
  const fig = PACK[10][0];
  return {
    type:'JACKPOT',
    prize: Math.max(100, +S.pool.toFixed(2)),
    center:[fig,fig,fig],
    label:'JACKPOT'
  };
}

function createWin(tier, forceLabel){
  let t = tier;
  let prize = WIN_PRIZE[t];

  // банк проекта не должен уходить в минус
  const maxPay = Math.max(1, S.bank * 0.65);

  while(t > 1 && WIN_PRIZE[t] > maxPay){
    t--;
    prize = WIN_PRIZE[t];
  }

  prize = Math.min(prize, maxPay);
  prize = +prize.toFixed(2);

  const fig = randomFigFromTier(t);
  return {
    type:'WIN',
    tier:t,
    prize,
    center:[fig,fig,fig],
    label: forceLabel || 'WIN'
  };
}

function createNear(tier){
  let t = tier === 10 ? 9 : tier;
  let prize = Math.min(NEAR_PRIZE[t], Math.max(0.2, S.bank * 0.25));
  prize = +prize.toFixed(2);

  const fig = randomFigFromTier(t);
  const third = randomFigNot(fig);

  return {
    type:'NEAR',
    tier:t,
    prize,
    center:[fig,fig,third],
    label:'NEAR WIN'
  };
}

function createMini(){
  const t = [1,1,1,2,2,3][Math.floor(Math.random()*6)];
  let prize = +rnd(0.25, 0.8).toFixed(2);
  prize = Math.min(prize, Math.max(0.2, S.bank * 0.2));

  const fig = randomFigFromTier(t);
  const third = randomFigNot(fig);

  return {
    type:'MINI',
    tier:t,
    prize:+prize.toFixed(2),
    center:[fig,fig,third],
    label:'MINI'
  };
}

function createLose(){
  const a = randomFig();
  const b = randomFigNot(a);
  let c = randomFigNot(b);
  if(c.e === a.e) c = randomFigNot(a);

  return {
    type:'LOSE',
    prize:0,
    center:[a,b,c],
    label:''
  };
}

function pickOutcome(){
  // FEVER: если шкала заполнена, принудительно даём занос
  if(S.fever >= 100){
    const t = weighted(FEVER_TIERS);
    return createWin(t, 'FEVER WIN');
  }

  const rtp = currentRTP();

  // контроллер качелей
  let ctrl = clamp(1 + (TARGET_RTP - rtp) * 2.2, 0.25, 1.8);

  // если банк проекта подгорел, режем щедрость
  if(S.bank < 30) ctrl *= 0.25;

  const jackpotP = S.pool >= 100 ? 0.0012 * Math.min(ctrl, 1.5) : 0;
  const winP = 0.065 * ctrl;
  const nearP = 0.30 * clamp(ctrl, 0.7, 1.25);
  const miniP = 0.25;

  const r = Math.random();

  if(r < jackpotP) return createJackpot();
  if(r < winP) return createWin(weighted(WIN_TIERS));
  if(r < winP + nearP) return createNear(weighted(NEAR_TIERS));
  if(r < winP + nearP + miniP) return createMini();

  return createLose();
}

const reels = [...document.querySelectorAll('.strip')];

function symHTML(fig){
  return `<div class="sym">${imgTag(fig)}</div>`;
}

function renderIdle(){
  reels.forEach(strip => {
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    strip.innerHTML = [randomFig(), randomFig(), randomFig()].map(symHTML).join('');
  });
}

function cellHeight(){
  const reel = document.querySelector('.reel');
  return reel.clientHeight / 3;
}

async function animateSpin(outcome){
  const h = cellHeight();
  const dur = S.turbo ? 210 : 620;
  const delays = S.turbo ? [0,35,70] : [0,110,220];
  const spinCount = S.turbo ? 6 : 16;

  const promises = reels.map((strip, i) => {
    const syms = [];

    for(let k=0;k<spinCount;k++){
      syms.push(randomFig());
    }

    syms.push(outcome.grid[i][0], outcome.grid[i][1], outcome.grid[i][2]);

    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    strip.innerHTML = syms.map(symHTML).join('');

    void strip.offsetHeight;

    const target = -(syms.length - 3) * h;
    strip.style.transition = `transform ${dur}ms cubic-bezier(.2,.8,.2,1) ${delays[i]}ms`;
    strip.style.transform = `translateY(${target}px)`;

    return new Promise(res => setTimeout(res, dur + delays[i] + 35));
  });

  await Promise.all(promises);
}

function addWinFeed(fig, prize){
  const box = document.createElement('div');
  box.className = 'wc';
  box.innerHTML = `${imgTag(fig)}<span>+${fmt(prize)}$</span>`;
  const w = $('wins');
  w.insertBefore(box, w.firstChild);
  while(w.children.length > 8) w.removeChild(w.lastChild);
}

function burst(color){
  const cv = $('fx');
  const ctx = cv.getContext('2d');
  const d = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * d;
  cv.height = innerHeight * d;

  const parts = [];
  const cx = innerWidth/2*d;
  const cy = innerHeight/2*d;

  for(let i=0;i<32;i++){
    const a = Math.random()*Math.PI*2;
    const v = rnd(3, 10)*d;
    parts.push({
      x:cx,
      y:cy,
      vx:Math.cos(a)*v,
      vy:Math.sin(a)*v - 3*d,
      life:1,
      color,
      size:rnd(2,5)*d
    });
  }

  let raf;
  function step(){
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;

    for(const p of parts){
      if(p.life <= 0) continue;
      alive = true;
      p.vy += .3*d;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= .03;

      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size*1.6);
    }

    ctx.globalAlpha = 1;

    if(alive) raf = requestAnimationFrame(step);
    else ctx.clearRect(0,0,cv.width,cv.height);
  }

  cancelAnimationFrame(raf);
  step();
}

let bigTimer;
function showBig(outcome){
  const el = $('bigWin');
  const fig = outcome.center[0];

  $('bigFace').innerHTML = imgTag(fig);
  $('bigName').textContent = fig.n;
  $('bigPrize').textContent = '+' + fmt(outcome.prize) + '$';
  $('bigSub').textContent = outcome.label || 'BIG WIN';

  el.classList.remove('hidden');
  burst(outcome.type === 'JACKPOT' ? '#ffd75e' : '#ff6a00');
  hapOk();

  clearTimeout(bigTimer);
  bigTimer = setTimeout(() => el.classList.add('hidden'), outcome.type === 'JACKPOT' ? 1600 : 1050);
}

function applyOutcome(outcome){
  if(outcome.prize > 0){
    S.balance += outcome.prize;
    S.stats.won += outcome.prize;

    if(outcome.type === 'JACKPOT'){
      S.pool = 100;
    }else{
      S.bank = Math.max(0, S.bank - outcome.prize);
    }

    S.fever = 0;
    addWinFeed(outcome.center[0], outcome.prize);

    if(outcome.prize >= 15 || outcome.type === 'JACKPOT'){
      showBig(outcome);
    }else{
      toast('+' + fmt(outcome.prize) + '$');
      hap('medium');
    }
  }else{
    if(outcome.type === 'LOSE') S.fever = Math.min(100, S.fever + 10);
    if(outcome.type === 'NEAR') S.fever = Math.min(100, S.fever + 5);
    if(outcome.type === 'MINI') S.fever = Math.min(100, S.fever + 3);
  }

  updateHUD();
  save();
}

function updateHUD(){
  $('balVal').textContent = fmt(S.balance);
  $('poolVal').textContent = fmt(S.pool);
  $('feverBar').style.width = S.fever + '%';
  $('feverWrap').classList.toggle('full', S.fever >= 100);

  const spinBtn = $('spinBtn');
  spinBtn.disabled = S.spinning || S.balance < SPIN_COST;
  spinBtn.textContent = `SPIN ${fmt(SPIN_COST)}$`;
  spinBtn.classList.toggle('ready', !S.spinning && S.balance >= SPIN_COST);

  $('turboBtn').classList.toggle('on', S.turbo);

  document.querySelectorAll('.autoBtn').forEach(btn => {
    const n = parseInt(btn.dataset.auto, 10);
    if(n === 0){
      btn.classList.toggle('on', S.auto > 0);
    }else{
      btn.classList.toggle('on', S.auto > 0);
    }
  });
}

async function spin(){
  if(S.spinning) return;

  if(S.balance < SPIN_COST){
    if(S.auto > 0) S.auto = 0;
    toast('Not enough USDT');
    updateHUD();
    return;
  }

  S.spinning = true;
  updateHUD();

  S.balance -= SPIN_COST;
  S.stats.spent += SPIN_COST;
  S.stats.spins++;

  S.bank += BANK_CUT;
  S.pool += POOL_CUT;

  const outcome = pickOutcome();
  outcome.grid = makeGrid(outcome.center);

  hap('light');

  await animateSpin(outcome);
  applyOutcome(outcome);

  S.spinning = false;
  updateHUD();

  if(S.auto > 0){
    S.auto--;
    updateHUD();
    setTimeout(spin, S.turbo ? 70 : 230);
  }
}

$('spinBtn').onclick = spin;

$('turboBtn').onclick = () => {
  S.turbo = !S.turbo;
  updateHUD();
  save();
};

document.querySelectorAll('.autoBtn').forEach(btn => {
  btn.onclick = () => {
    const n = parseInt(btn.dataset.auto, 10);

    if(n === 0){
      S.auto = 0;
      updateHUD();
      save();
      return;
    }

    if(S.auto > 0){
      S.auto = 0;
      updateHUD();
      save();
      return;
    }

    S.auto = n;
    updateHUD();
    spin();
  };
});

$('topUpBtn').onclick = () => {
  S.balance += 100;
  toast('+100 USDT (demo)');
  updateHUD();
  save();
};

$('walletBtn').onclick = () => {
  toast('DEMO wallet — backend later');
};

renderIdle();
updateHUD();
</script>
</body>
</html>
